<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>知岸图标预览</title>
    <style>
      :root {
        color: #293a2e;
        background: #f6f7f2;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      body {
        margin: 0;
        padding: 32px 20px 64px;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      p {
        color: #667464;
        margin: 0 0 28px;
      }
      section {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 28px;
      }
      figure {
        margin: 0;
        background: #fff;
        border: 1px solid #dfe7d3;
        border-radius: 10px;
        padding: 18px;
        text-align: center;
      }
      img {
        display: block;
        object-fit: contain;
      }
      figcaption {
        margin-top: 10px;
        color: #71806b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>知岸学习图标预览</h1>
      <p>主图标和浅色版的实际导出尺寸，用于检查小尺寸下的识别度。</p>
      <section>
        <figure><img src="zhian-icon-512.png" width="256" height="256" alt="主图标 512" /><figcaption>主图标 512 × 512</figcaption></figure>
        <figure><img src="zhian-icon-144.png" width="144" height="144" alt="主图标 144" /><figcaption>主图标 144 × 144</figcaption></figure>
        <figure><img src="zhian-icon-108.png" width="108" height="108" alt="主图标 108" /><figcaption>主图标 108 × 108</figcaption></figure>
      </section>
      <section>
        <figure><img src="zhian-icon-light-512.png" width="256" height="256" alt="浅色图标 512" /><figcaption>浅色版 512 × 512</figcaption></figure>
        <figure><img src="zhian-icon-light-144.png" width="144" height="144" alt="浅色图标 144" /><figcaption>浅色版 144 × 144</figcaption></figure>
        <figure><img src="zhian-icon-light-108.png" width="108" height="108" alt="浅色图标 108" /><figcaption>浅色版 108 × 108</figcaption></figure>
      </section>
    </main>
  </body>
</html>
